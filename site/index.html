<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio DevOps</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e3a8a);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 40px 50px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    h1 {
      color: #38bdf8;
      margin-bottom: 4px;
    }
    h2 {
      color: #94a3b8;
      font-weight: normal;
      margin-top: 0;
    }
    p {
      font-size: 1.1em;
    }
    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 14px;
      background: #38bdf8;
      color: #0f172a;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sitio de prueba</h1>
    <h2>Desarrollo Web</h2>
    <p>Docker, Kubernetes y GitHub Actions</p>
    <span class="badge">CI/CD Pipeline</span>
    <p>Heber Ignacio - 5090 23 10640</p>
  </div>
</body>
</html>
